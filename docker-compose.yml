x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/competitor_pulse
    SMTP_HOST: mailpit
  depends_on:
    db:
      condition: service_healthy
  develop:
    watch:
      - action: sync
        path: ./backend/app
        target: /app/app
      - action: sync
        path: ./backend/alembic
        target: /app/alembic
      - action: sync
        path: ./backend/tests
        target: /app/tests
      - action: sync
        path: ./backend/evals
        target: /app/evals
      - action: rebuild
        path: ./backend/uv.lock

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competitor_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package-lock.json

  # Fictional competitor websites so the full pipeline runs locally without touching real sites.
  demo-sites:
    image: nginx:alpine
    volumes:
      - ./demo_sites/public:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  # Catches outgoing digest emails in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/competitor_pulse
    SMTP_HOST: mailpit
  depends_on:
    db:
      condition: service_healthy
  # Bind-mount the source for hot reload; the virtualenv lives in /opt/venv so it isn't shadowed.
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competitor_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    <<: *backend
    command: watchfiles --filter python "python -m app.worker" app
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    # Mount source and config only, so the image's node_modules stays in place.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/eslint.config.js:/app/eslint.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json

  # Fictional competitor websites so the full pipeline runs locally without touching real sites.
  demo-sites:
    image: nginx:alpine
    volumes:
      - ./demo_sites/public:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  # Catches outgoing digest emails in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  pgdata:
